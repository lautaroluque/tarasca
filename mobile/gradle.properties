# AndroidX is required by androidx.core:core-ktx; the build fails
# checkDebugAarMetadata without this flag.
android.useAndroidX=true

# Supabase values for BuildConfig are written by CI into local.properties
# (gitignored). Override for local builds there, not here.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
