[project]
name = "tarasca"
version = "0.1.0"
description = "Personal financial tracker/planning app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.39.0",
    "pandas>=2.2.0",
    "supabase>=2.9.0",
    "plotly>=5.24.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
